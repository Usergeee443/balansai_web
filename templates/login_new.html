<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balans AI - Kirish</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0088CC 0%, #0077B5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #0088CC;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 10px;
        }

        .step {
            width: 40px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .step.active {
            background: #0088CC;
        }

        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            text-align: center;
        }

        .form-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
            border-color: #0088CC;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: #0088CC;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0077B5;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .forgot-password-link {
            text-align: center;
            margin-top: 16px;
        }

        .forgot-password-link a {
            color: #0088CC;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-password-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .code-input {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .code-input input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
        }

        .code-input input:focus {
            border-color: #0088CC;
            outline: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .resend-timer {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .resend-timer a {
            color: #0088CC;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 28px;
            }

            .code-input input {
                width: 45px;
                height: 55px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>💰 Balans AI</h1>
            <p>Moliyaviy boshqaruv tizimi</p>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step1"></div>
            <div class="step" id="step2"></div>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Step 1: Phone Number -->
        <div class="form-step active" id="phoneStep">
            <h2 class="form-title">Telefon raqamingizni kiriting</h2>
            <p class="form-description">Kirish uchun telefon raqamingizni kiriting</p>

            <form id="phoneForm">
                <div class="input-group">
                    <label for="phoneInput">Telefon raqam</label>
                    <input
                        type="tel"
                        id="phoneInput"
                        placeholder="+998 90 123 45 67"
                        required
                        autocomplete="tel"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="phoneBtn">
                    Davom etish
                </button>
            </form>
        </div>

        <!-- Step 2: Password or Set Password -->
        <div class="form-step" id="passwordStep">
            <h2 class="form-title" id="passwordTitle">Parolni kiriting</h2>
            <p class="form-description" id="passwordDescription">Hisobingizga kirish uchun parolni kiriting</p>

            <form id="passwordForm">
                <div class="input-group">
                    <label for="passwordInput" id="passwordLabel">Parol</label>
                    <input
                        type="password"
                        id="passwordInput"
                        placeholder="Parolni kiriting"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="input-group" id="confirmPasswordGroup" style="display: none;">
                    <label for="confirmPasswordInput">Parolni tasdiqlang</label>
                    <input
                        type="password"
                        id="confirmPasswordInput"
                        placeholder="Parolni qayta kiriting"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="passwordBtn">
                    Kirish
                </button>

                <button type="button" class="btn btn-secondary" id="backBtn">
                    Orqaga
                </button>

                <div class="forgot-password-link" id="forgotPasswordLink">
                    <a href="#" id="forgotPasswordBtn">Parolni unutdim</a>
                </div>
            </form>
        </div>

        <!-- Step 3: Forgot Password - OTP Code -->
        <div class="form-step" id="forgotPasswordStep">
            <h2 class="form-title">Parolni tiklash</h2>
            <p class="form-description">Telegram botga yuborilgan kodni kiriting</p>

            <form id="forgotPasswordForm">
                <div class="input-group">
                    <div class="code-input">
                        <input type="text" maxlength="1" class="code-digit" data-index="0" autocomplete="off">
                        <input type="text" maxlength="1" class="code-digit" data-index="1" autocomplete="off">
                        <input type="text" maxlength="1" class="code-digit" data-index="2" autocomplete="off">
                        <input type="text" maxlength="1" class="code-digit" data-index="3" autocomplete="off">
                        <input type="text" maxlength="1" class="code-digit" data-index="4" autocomplete="off">
                        <input type="text" maxlength="1" class="code-digit" data-index="5" autocomplete="off">
                    </div>
                </div>

                <div class="input-group" id="newPasswordGroup" style="display: none;">
                    <label for="newPasswordInput">Yangi parol</label>
                    <input
                        type="password"
                        id="newPasswordInput"
                        placeholder="Yangi parolni kiriting"
                        autocomplete="new-password"
                    >
                </div>

                <div class="input-group" id="confirmNewPasswordGroup" style="display: none;">
                    <label for="confirmNewPasswordInput">Yangi parolni tasdiqlang</label>
                    <input
                        type="password"
                        id="confirmNewPasswordInput"
                        placeholder="Parolni qayta kiriting"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="forgotPasswordBtn">
                    Tasdiqlash
                </button>

                <button type="button" class="btn btn-secondary" id="backToPasswordBtn">
                    Orqaga
                </button>
            </form>
        </div>
    </div>

    <script>
        let phoneNumber = '';
        let hasPassword = false;
        let isFirstLogin = false;

        // Elements
        const phoneStep = document.getElementById('phoneStep');
        const passwordStep = document.getElementById('passwordStep');
        const forgotPasswordStep = document.getElementById('forgotPasswordStep');
        const phoneForm = document.getElementById('phoneForm');
        const passwordForm = document.getElementById('passwordForm');
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const phoneInput = document.getElementById('phoneInput');
        const passwordInput = document.getElementById('passwordInput');
        const confirmPasswordInput = document.getElementById('confirmPasswordInput');
        const newPasswordInput = document.getElementById('newPasswordInput');
        const confirmNewPasswordInput = document.getElementById('confirmNewPasswordInput');
        const phoneBtn = document.getElementById('phoneBtn');
        const passwordBtn = document.getElementById('passwordBtn');
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
        const backBtn = document.getElementById('backBtn');
        const backToPasswordBtn = document.getElementById('backToPasswordBtn');
        const forgotPasswordLinkBtn = document.getElementById('forgotPasswordBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const codeDigits = document.querySelectorAll('.code-digit');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const passwordTitle = document.getElementById('passwordTitle');
        const passwordDescription = document.getElementById('passwordDescription');
        const passwordLabel = document.getElementById('passwordLabel');
        const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
        const newPasswordGroup = document.getElementById('newPasswordGroup');
        const confirmNewPasswordGroup = document.getElementById('confirmNewPasswordGroup');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');

        // Phone number formatting
        phoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 12) value = value.slice(0, 12);

            if (value.length > 0) {
                let formatted = '+';
                if (value.length > 0) formatted += value.slice(0, 3);
                if (value.length > 3) formatted += ' ' + value.slice(3, 5);
                if (value.length > 5) formatted += ' ' + value.slice(5, 8);
                if (value.length > 8) formatted += ' ' + value.slice(8, 10);
                if (value.length > 10) formatted += ' ' + value.slice(10, 12);
                e.target.value = formatted;
            }
        });

        // Code input handling
        codeDigits.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value.replace(/\D/g, '');
                e.target.value = value;
                if (value.length === 1 && index < 5) {
                    codeDigits[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    codeDigits[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/\D/g, '');
                for (let i = 0; i < pastedData.length && i < 6; i++) {
                    codeDigits[i].value = pastedData[i];
                }
                if (pastedData.length === 6) {
                    codeDigits[5].focus();
                }
            });
        });

        // Phone form submit
        phoneForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const phone = phoneInput.value.replace(/\D/g, '');
            if (phone.length < 12) {
                showError('To\'liq telefon raqam kiriting');
                return;
            }

            phoneNumber = '+' + phone;
            phoneBtn.disabled = true;
            phoneBtn.innerHTML = '<span class="loading"></span>Tekshirilmoqda...';

            try {
                // Check if user has password
                const response = await fetch('/api/auth/check-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phoneNumber })
                });

                const data = await response.json();

                if (response.ok) {
                    hasPassword = data.has_password;
                    isFirstLogin = !hasPassword;

                    if (hasPassword) {
                        // User has password, go to password step
                        goToPasswordStep();
                    } else {
                        // First login, need to set password
                        goToSetPasswordStep();
                    }
                } else {
                    showError(data.error || 'Xatolik yuz berdi');
                }
            } catch (error) {
                showError('Tarmoq xatosi. Qaytadan urinib ko\'ring');
            } finally {
                phoneBtn.disabled = false;
                phoneBtn.innerHTML = 'Davom etish';
            }
        });

        // Password form submit
        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (isFirstLogin) {
                // Setting password for first time
                if (!password || password.length < 6) {
                    showError('Parol kamida 6 belgidan iborat bo\'lishi kerak');
                    return;
                }

                if (password !== confirmPassword) {
                    showError('Parollar mos kelmaydi');
                    return;
                }

                passwordBtn.disabled = true;
                passwordBtn.innerHTML = '<span class="loading"></span>Saqlanmoqda...';

                try {
                    const response = await fetch('/api/auth/set-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            phone: phoneNumber,
                            password: password,
                            confirm_password: confirmPassword
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showSuccess('Parol muvaffaqiyatli o\'rnatildi!');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    } else {
                        showError(data.error || 'Xatolik yuz berdi');
                        passwordBtn.disabled = false;
                        passwordBtn.innerHTML = 'Saqlash';
                    }
                } catch (error) {
                    showError('Tarmoq xatosi. Qaytadan urinib ko\'ring');
                    passwordBtn.disabled = false;
                    passwordBtn.innerHTML = 'Saqlash';
                }
            } else {
                // Login with password
                if (!password) {
                    showError('Parolni kiriting');
                    return;
                }

                passwordBtn.disabled = true;
                passwordBtn.innerHTML = '<span class="loading"></span>Kirilmoqda...';

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            phone: phoneNumber,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showSuccess('Muvaffaqiyatli kirdingiz!');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    } else {
                        showError(data.error || 'Parol noto\'g\'ri');
                        passwordInput.value = '';
                        passwordBtn.disabled = false;
                        passwordBtn.innerHTML = 'Kirish';
                    }
                } catch (error) {
                    showError('Tarmoq xatosi. Qaytadan urinib ko\'ring');
                    passwordBtn.disabled = false;
                    passwordBtn.innerHTML = 'Kirish';
                }
            }
        });

        // Forgot password link
        forgotPasswordLinkBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            hideMessages();

            forgotPasswordLinkBtn.style.pointerEvents = 'none';
            forgotPasswordLinkBtn.textContent = 'Yuborilmoqda...';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phoneNumber })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Kod Telegram botga yuborildi!');
                    setTimeout(() => {
                        goToForgotPasswordStep();
                    }, 1000);
                } else {
                    showError(data.error || 'Xatolik yuz berdi');
                }
            } catch (error) {
                showError('Tarmoq xatosi. Qaytadan urinib ko\'ring');
            } finally {
                forgotPasswordLinkBtn.style.pointerEvents = 'auto';
                forgotPasswordLinkBtn.textContent = 'Parolni unutdim';
            }
        });

        // Forgot password form submit
        forgotPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const code = Array.from(codeDigits).map(input => input.value).join('');
            const newPassword = newPasswordInput.value;
            const confirmNewPassword = confirmNewPasswordInput.value;

            if (newPasswordGroup.style.display === 'none') {
                // First step: verify OTP
                if (code.length !== 6) {
                    showError('6 raqamli kodni to\'liq kiriting');
                    return;
                }

                forgotPasswordBtn.disabled = true;
                forgotPasswordBtn.innerHTML = '<span class="loading"></span>Tekshirilmoqda...';

                try {
                    // Verify code (we'll use it to show password fields)
                    // In real implementation, verify code first
                    newPasswordGroup.style.display = 'block';
                    confirmNewPasswordGroup.style.display = 'block';
                    forgotPasswordBtn.innerHTML = 'Parolni o\'zgartirish';
                    forgotPasswordBtn.disabled = false;
                } catch (error) {
                    showError('Tarmoq xatosi. Qaytadan urinib ko\'ring');
                    forgotPasswordBtn.disabled = false;
                    forgotPasswordBtn.innerHTML = 'Tasdiqlash';
                }
            } else {
                // Second step: set new password
                if (!newPassword || newPassword.length < 6) {
                    showError('Parol kamida 6 belgidan iborat bo\'lishi kerak');
                    return;
                }

                if (newPassword !== confirmNewPassword) {
                    showError('Parollar mos kelmaydi');
                    return;
                }

                forgotPasswordBtn.disabled = true;
                forgotPasswordBtn.innerHTML = '<span class="loading"></span>O\'zgartirilmoqda...';

                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            phone: phoneNumber,
                            code: code,
                            password: newPassword,
                            confirm_password: confirmNewPassword
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showSuccess('Parol muvaffaqiyatli o\'zgartirildi!');
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 1500);
                    } else {
                        showError(data.error || 'Xatolik yuz berdi');
                        forgotPasswordBtn.disabled = false;
                        forgotPasswordBtn.innerHTML = 'Parolni o\'zgartirish';
                    }
                } catch (error) {
                    showError('Tarmoq xatosi. Qaytadan urinib ko\'ring');
                    forgotPasswordBtn.disabled = false;
                    forgotPasswordBtn.innerHTML = 'Parolni o\'zgartirish';
                }
            }
        });

        // Back buttons
        backBtn.addEventListener('click', () => {
            goToPhoneStep();
        });

        backToPasswordBtn.addEventListener('click', () => {
            goToPasswordStep();
        });

        // Navigation functions
        function goToPhoneStep() {
            phoneStep.classList.add('active');
            passwordStep.classList.remove('active');
            forgotPasswordStep.classList.remove('active');
            step1.classList.add('active');
            step2.classList.remove('active');
            phoneInput.value = '';
            passwordInput.value = '';
            confirmPasswordInput.value = '';
            hideMessages();
        }

        function goToPasswordStep() {
            phoneStep.classList.remove('active');
            passwordStep.classList.add('active');
            forgotPasswordStep.classList.remove('active');
            step1.classList.add('active');
            step2.classList.add('active');
            passwordTitle.textContent = 'Parolni kiriting';
            passwordDescription.textContent = 'Hisobingizga kirish uchun parolni kiriting';
            passwordLabel.textContent = 'Parol';
            passwordBtn.textContent = 'Kirish';
            confirmPasswordGroup.style.display = 'none';
            forgotPasswordLink.style.display = 'block';
            isFirstLogin = false;
            passwordInput.focus();
        }

        function goToSetPasswordStep() {
            phoneStep.classList.remove('active');
            passwordStep.classList.add('active');
            forgotPasswordStep.classList.remove('active');
            step1.classList.add('active');
            step2.classList.add('active');
            passwordTitle.textContent = 'Parol o\'ylab toping';
            passwordDescription.textContent = 'Xavfsizlik uchun parol o\'ylab toping (kamida 6 belgi)';
            passwordLabel.textContent = 'Yangi parol';
            passwordBtn.textContent = 'Saqlash';
            confirmPasswordGroup.style.display = 'block';
            forgotPasswordLink.style.display = 'none';
            isFirstLogin = true;
            passwordInput.focus();
        }

        function goToForgotPasswordStep() {
            phoneStep.classList.remove('active');
            passwordStep.classList.remove('active');
            forgotPasswordStep.classList.add('active');
            step1.classList.add('active');
            step2.classList.add('active');
            codeDigits.forEach(input => input.value = '');
            newPasswordGroup.style.display = 'none';
            confirmNewPasswordGroup.style.display = 'none';
            forgotPasswordBtn.innerHTML = 'Tasdiqlash';
            codeDigits[0].focus();
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }

        function hideMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }
    </script>
</body>
</html>
